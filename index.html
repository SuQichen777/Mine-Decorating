<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mine-Decorating</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to bottom right, #2c6262, #45a049);
            color: #ffffff;
            margin: 0;
            min-height: 100vh;
        }

        #canvas1 {
            display: block;
            background-color: #a8cac1;
            touch-action: none; /* dragging on the canvas turns the room instead of scrolling */
        }

        #canvas2 {
            flex-direction: column;
            position: absolute;
            right: 50px;
            top: 100px;
            background-color: #a8cac1;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            align-items: center;
            padding: 16px 16px 0;
        }

        .size-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #sliderValue {
            color: #ffcc00;
            min-width: 3em;
            font-size: clamp(16px, 1.8vw, 24px);
        }

        button {
            padding: 10px 20px;
            background-color: #2c6262;
            color: rgb(238, 207, 10);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: clamp(16px, 1.9vw, 26px);
        }

        button:hover {
            background-color: #45a049;
        }

        select {
            padding: 10px 20px;
            background-color: transparent;
            color: rgb(238, 207, 10);
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 30px;
        }

        label {
            color: #ffcc00;
            font-size: clamp(16px, 1.9vw, 26px);
            margin-right: 2px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: min(200px, 40vw);
            height: 20px;
            background: #45a049;
            border-radius: 5px;
            outline: none;
            opacity: 0.9;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        input[type="range"]:hover {
            opacity: 1;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #ffcc00;
            border: 2px solid #ffffff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: #ffa500;
            transform: scale(1.1);
        }

        /* buttons | canvas | buttons; the canvas column takes the rest of the width */
        .layout {
            display: grid;
            grid-template-columns: max-content minmax(0, 1fr) max-content;
            grid-template-areas: "left stage right";
            gap: 16px;
            align-items: center;
            padding: 16px;
        }

        .stage {
            grid-area: stage;
            display: flex;
            justify-content: center;
        }

        .left-buttons {
            grid-area: left;
        }

        .right-buttons {
            grid-area: right;
        }

        .side-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            color: #ffcc00;
            font-size: clamp(15px, 1.4vw, 20px);
            max-width: 280px;
        }

        .group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .side-buttons button {
            padding: 10px 20px;
            background-color: #2c6262;
            color: #ffcc00;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: clamp(15px, 1.4vw, 20px);
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .side-buttons button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        /* narrow screen: canvas first, buttons below it in a grid, moving buttons first */
        @media (max-width: 860px) {
            .layout {
                grid-template-columns: minmax(0, 1fr);
                grid-template-areas: "stage" "left" "right";
                align-items: start;
            }

            .side-buttons {
                max-width: none;
            }

            .group {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 8px;
            }

            .group-label {
                grid-column: 1 / -1;
            }

            .move-group {
                order: -1;
            }

            nav button,
            .side-buttons button {
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>
    <nav class="toolbar">
        <!-- <button id="add_c" onclick="editMode()">Edit Mode</button>
        <button id="edit_c" onclick="viewMode()">View Mode</button> -->
        <button id="select" onclick="selectItem()">Select (next) Item</button>
        <button id="delete" onclick="deleteItem()">Delete Selected Item</button>
        <!-- <select id="curveType">
            <option value="hermite">Hermite Spline</option>
            <option value="bezier">Bezier Curve</option>
            <option value="bSpline">B-Spline</option>
        </select> -->
        <span class="size-control">
            <label for="sizeSlider">Size: </label>
            <input type="range" id="sizeSlider" min="0.3" max="2" step="0.05" value="1.0" oninput="updateSize()">
            <span id="sliderValue">1.0</span>
        </span>
    </nav>

    <main class="layout">
        <div class="stage">
            <canvas id='canvas1' width="700" height="700"></canvas>
            <!-- <canvas id='canvas2' width="100" height="700"></canvas> -->
        </div>

        <!-- Left -->
        <div class="side-buttons left-buttons">
            <div class="group platform-group">
                <span class="group-label">Select A Platform:</span>
                <button onclick="selectPlatform(floor)">Select Floor</button>
                <button onclick="selectPlatform(back_wall)">Select Back Wall</button>
                <button onclick="selectPlatform(no_platform)">Deselect Platform</button>
                <button onclick="hidePlatform(left_wall)">Hide Left Wall</button>
                <button onclick="hidePlatform(right_wall)">Hide Right Wall</button>
            </div>
            <div class="group move-group">
                <span class="group-label">Move Item:</span>
                <button onclick="moveItem('red')">Move 1 Unit -> Red</button>
                <button onclick="moveItem('blue')">Move 1 Unit -> blue</button>
                <button onclick="rotateItem('red')">Rotate -> red</button>
                <button onclick="rotateItem('blue')">Rotate -> blue</button>
                <button onclick="stopChangeItem()">Check!</button>
            </div>
        </div>

        <!-- Right -->
        <div class="side-buttons right-buttons">
            <div class="group">
                <span class="group-label">Add Furniture:</span>
                <button onclick="addItem('chair')">Chair</button>
                <button onclick="addItem('table')">Table</button>
                <button onclick="addItem('bed')">Bed</button>
                <button onclick="addItem('sofa')">Sofa</button>
            </div>
            <div class="group">
                <span class="group-label">Add Small Things (can be on Table):</span>
                <button onclick="addItem('television')">Television</button>
                <button onclick="addItem('computer')">Computer</button>
            </div>
            <div class="group">
                <span class="group-label">Add Wall Decorations:</span>
                <button onclick="addItem('painting')">Painting</button>
                <button onclick="addItem('clock')">Clock</button>
            </div>
        </div>
    </main>

    <script src=lib.js></script>

        //canvas size: the biggest square that fits next to (or, on a narrow screen, above) the buttons
        const resizeCanvas = () => {
            let stage = document.querySelector('.stage');
            let toolbar = document.querySelector('.toolbar');
            let free_height = window.innerHeight - toolbar.offsetHeight - 32;
            let css_size = Math.floor(Math.max(Math.min(stage.clientWidth, free_height), Math.min(stage.clientWidth, 260)));
            let pixel_ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas1.style.width = css_size + 'px';
            canvas1.style.height = css_size + 'px';
            canvas1.width = Math.round(css_size * pixel_ratio);
            canvas1.height = Math.round(css_size * pixel_ratio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
        //mouse (pointer events also cover touch)
        let mx, my, rx = 0, ry = 0;
        canvas1.onpointerdown = e => { mx = e.clientX; my = e.clientY; canvas1.setPointerCapture(e.pointerId); }
        canvas1.onpointermove = e => { if (mx !== undefined) { rx += e.clientX - mx; ry += e.clientY - my; mx = e.clientX; my = e.clientY; } }
        canvas1.onpointerup = e => mx = undefined;
        canvas1.onpointercancel = e => mx = undefined;

        } else if (e.key === 'ArrowLeft') {
            viewOffsetX += step;

        if (e.key === 'ArrowUp') {
            viewOffsetY -= step;
        } else if (e.key === 'ArrowDown') {
            viewOffsetY += step;
